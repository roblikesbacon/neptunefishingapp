<title>Redirecting to Neptune</title>

<!-- The walkthrough moved from /demo.html to the site root on 2026-07-30.
     GitHub Pages can't issue a real 301, so this stub keeps the old URL alive
     for anything already shared. The canonical tag and noindex make sure
     search engines credit "/" and not this page. -->
<link rel="canonical" href="https://neptunefishingapp.com/" />
<meta name="robots" content="noindex, follow" />
<meta http-equiv="refresh" content="0; url=/" />

<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #050b0e;
    color: #8faeb4;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  a { color: #22d3ee; }
</style>
</head>
<body>
  <p>
    This page has moved.<br />
    <a href="/">Continue to Neptune &rarr;</a>
  </p>
  <script>location.replace('/');</script>
</body>
</html>
